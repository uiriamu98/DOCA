<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Donation Goal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&family=Open+Sans&family=Montserrat&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="goal-style.css">
</head>

<body>
    <div class="goal">
        <div class="title">
            Avatar: Frontiers of Pandora™
        </div>
        <div class="bar">
            <div id="fill"></div>
            <div class="amount">
                <span id="raised">
                    0.00
                </span>
                /
                <span id="goal">
                    40
                </span>
                <span id="currencyLabel">CAD</span>
            </div>
        </div>
    </div>
    <script src="goal-script.js"></script>
</body>
</html>
